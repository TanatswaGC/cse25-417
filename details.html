<!-- Product Grid Item Container (Repeat this section block for each item in your shop) -->
    <section class="product-card" style="max-width: 380px; width: 100%; margin: 20px auto; background-color: rgba(0, 0, 0, 0.8); border: 1px solid #333333; border-top: 4px solid #ffffff; border-radius: 4px; padding: 25px; box-sizing: border-box; backdrop-filter: blur(5px); text-align: center;">
        
        <!-- Product Image Display Asset -->
        <img src="imgs/straps.png" alt="LOXØS Lifting Straps" style="width: 100%; height: auto; border-radius: 2px; margin-bottom: 20px;">
        
        <!-- Product Details Header Block -->
        <header style="margin-bottom: 15px;">
            <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 5px 0; color: #ffffff;">LOXØS V1 Straps</h2>
            <p style="font-size: 1.25rem; font-weight: 700; color: #ffffff; margin: 0;">P350.00</p>
        </header>

        <!-- INTERACTIVE COMPONENT 1: Native "View Details" Expandable Workspace -->
        <details style="margin-bottom: 20px; text-align: left;">
            <summary style="width: 100%; padding: 12px; background-color: #222222; color: #ffffff; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #444444; border-radius: 4px; cursor: pointer; text-align: center; list-style-position: inside; box-sizing: border-box; outline: none;">
                View Details
            </summary>
            <!-- Dropdown expansion description panel -->
            <p style="font-size: 0.95rem; line-height: 1.6; color: #cccccc; margin-top: 15px; padding: 15px; background-color: #111111; border-radius: 4px; border-left: 2px solid #ffffff;">
                Engineered for maximum tensile resistance during heavy pulling movements. Features reinforced double-stitching layout and heavy-duty canvas density to lock your grip onto the bar seamlessly for deadlifts, rows, and heavy variations.
            </p>
        </details>

        <!-- INTERACTIVE COMPONENT 2: "Notify Me" Input Form Workflow Block -->
        <form action="#" method="POST" style="margin: 0; padding: 0;">
            <p style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
                <label for="notify-email" style="display: none;">Email Address</label>
                <input type="email" id="notify-email" name="email" required placeholder="Enter email for stock drop alerts" style="width: 100%; padding: 12px; background-color: #111111; border: 1px solid #333333; color: #ffffff; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box; text-align: center;">
                
                <button type="submit" style="width: 100%; padding: 14px; background-color: #ffffff; color: #000000; border: none; border-radius: 4px; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;">
                    Notify Me
                </button>
            </p>
        </form>

    </section>
