<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Feedback</title>
    <link rel="stylesheet" href="styles.css">    
</head>

<body>

   <header>
      <h1>We Value Your Feedback</h1>
       <nav> 
            <a href="index.html">Home</a>  
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a> 
            <a href="feedback.html" class="active">Feedback</a>
        </nav> 
   </header>

   <main class="container my-5" style="max-width: 600px;">
       <div class="card p-4 shadow-sm">
           <form action="#" method="POST">
               
               <!-- Star Rating Section -->
               <div class="mb-4 text-center">
                   <label class="form-label d-block h5 mb-3">How would you rate your experience?</label>
                   <div class="star-rating">
                       <input type="radio" id="star5" name="rating" value="5" />
                       <label for="star5" title="5 stars">&#9733;</label>
                       
                       <input type="radio" id="star4" name="rating" value="4" />
                       <label for="star4" title="4 stars">&#9733;</label>
                       
                       <input type="radio" id="star3" name="rating" value="3" />
                       <label for="star3" title="3 stars">&#9733;</label>
                       
                       <input type="radio" id="star2" name="rating" value="2" />
                       <label for="star2" title="2 stars">&#9733;</label>
                       
                       <input type="radio" id="star1" name="rating" value="1" />
                       <label for="star1" title="1 star">&#9733;</label>
                   </div>
               </div>

               <!-- Written Feedback Section -->
               <div class="mb-3">
                   <label for="comments" class="form-label h6">Additional Comments</label>
                   <textarea class="form-control" id="comments" name="comments" rows="4" placeholder="Tell us what you think..."></textarea>
               </div>

               <!-- Submit Button -->
               <div class="d-grid">
                   <button type="submit" class="btn btn-primary btn-lg">Submit Feedback</button>
               </div>

           </form>
       </div>
   </main>

   <footer>
       <p>&copy; 2025 Your Name</p>
   </footer>

</body>
</html>
